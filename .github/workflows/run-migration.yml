name: Run Specific Migration (cPanel)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select target environment'
        required: true
        type: choice
        options:
          - production
      branch:
        description: 'Select branch'
        required: true
        type: choice
        options:
          - prod
          - master
      migration_name:
        description: 'Migration filename WITHOUT the .php extension (e.g. 2026_07_08_000001_create_test_table)'
        required: true
        type: string
      confirm_password:
        description: 'Enter confirmation password to proceed with migration'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # PASSWORD CHECK
      # =========================
      - name: Validate password
        run: |
          if [ "${{ github.event.inputs.confirm_password }}" != "${{ secrets.MIGRATION_CONFIRM_PASSWORD }}" ]; then
            echo "Wrong password. Migration aborted."
            exit 1
          fi
          echo "Password verified"

      # =========================
      # PRODUCTION (cPanel shared hosting via HTTP endpoint)
      #
      # Calls the token-protected Laravel endpoint at
      # POST https://shiponsarder.com/api/system/migrate
      # =========================
      - name: Run migration via HTTP endpoint
        if: github.event.inputs.environment == 'production'
        env:
          ENDPOINT: https://shiponsarder.com/api/system/migrate
          TOKEN: ${{ secrets.MIGRATION_ENDPOINT_TOKEN }}
          MIGRATION_NAME: ${{ github.event.inputs.migration_name }}
        run: |
          set -e
          echo "Requesting migration: $MIGRATION_NAME"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"migration_name\":\"$MIGRATION_NAME\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Migration request failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Migration request completed"
